<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clicker | Portal IRB</title>
    <link rel="stylesheet" href="css/clicker.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@800&display=swap" rel="stylesheet">
    <script>
      if (!localStorage.getItem("usuarioIRB")) {
        window.location.href = "acceso.html";
      }
    </script>
</head>
<body>
  <div class="overlay"></div>
  <header>
    <a href="index.html" class="volver">← Volver al portal</a>
    <h1>Clicker</h1>
  </header>

  <main>
    <section class="intro">
      <h2>Entrena tus reflejos</h2>
      <p class="subtitulo">Haz clic en el mando lo más rápido que puedas.</p>

      <div class="stats-row">
        <div class="stat-box">
          <span class="stat-label">CPS actual</span>
          <span class="stat-valor" id="cps">0</span>
        </div>
        <div class="stat-box record-box">
          <span class="stat-label">🏆 Récord</span>
          <span class="stat-valor" id="record-display">0</span>
        </div>
        <div class="stat-box">
          <span class="stat-label">Clics totales</span>
          <span class="stat-valor" id="clics-totales">0</span>
        </div>
      </div>

      <div class="mando-wrap">
        <img src="imgs/mando.png" alt="Mando" class="avatar" id="mando">
      </div>

      <div id="mensaje-record" class="mensaje-record hidden">
        🏆 ¡Nuevo récord!
      </div>

      <p class="hint">La sesión termina automáticamente al dejar de clicar</p>
    </section>
  </main>

  <footer>
    <p>© 2025 Portal IRB</p>
  </footer>

  <script src="js/clicker.js"></script>
</body>
</html>
